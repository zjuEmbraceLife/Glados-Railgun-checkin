name: auto check

on:
  workflow_dispatch:

  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'

  schedule:
    # 默认使用 UTC；对应北京时间每天：
    # 00:31、04:31、08:31、12:31、16:31、20:31
    - cron: '31 */4 * * *'

jobs:
  build:
    name: glados/railgun checkin
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        python-version: ['3.13']

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pypushdeer

      - name: Running checkin
        run: python checkin.py
        env:
          PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
          GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}

      - name: Keep alive
        uses: liskin/gh-workflow-keepalive@v1

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 7
          delete_run_by_conclusion_pattern: success
